// ---------------------------------------------------------------------------
// Smart query engine
// ---------------------------------------------------------------------------

function parseQuery(q) {
  if (!q || !q.trim()) return [];
  const parts = q.match(/"[^"]+"|\S+/g) || [];
  return parts.map((raw) => {
    const p = raw.replace(/^"|"$/g, "");
    const m = p.match(/^([\w .%-]+?)\s*(>=|<=|>|<|=|:)\s*(.+)$/);
    if (m) return { field: m[1].trim().toLowerCase(), op: m[2], val: m[3].replace(/^"|"$/g, "").toLowerCase() };
    return { field: null, op: "contains", val: p.toLowerCase() };
  });
}

function cellValue(col, row) {
  return col.value ? col.value(row) : row[col.key];
}

function findColumn(columns, field) {
  return columns.find(
    (c) => c.key.toLowerCase() === field || c.label.toLowerCase() === field ||
      c.key.toLowerCase().startsWith(field) || c.label.toLowerCase().startsWith(field)
  );
}

function matchRow(row, tokens, columns) {
  if (!tokens.length) return true;
  return tokens.every((tok) => {
    if (!tok.field) return columns.some((c) => String(cellValue(c, row)).toLowerCase().includes(tok.val));
    const col = findColumn(columns, tok.field);
    if (!col) return columns.some((c) => String(cellValue(c, row)).toLowerCase().includes(tok.val));
    const raw = cellValue(col, row);
    if (tok.op === ":" || tok.op === "contains") return String(raw).toLowerCase().includes(tok.val);
    const num = parseFloat(String(raw).replace(/[^0-9.-]/g, ""));
    const target = parseFloat(tok.val);
    if (isNaN(num) || isNaN(target)) return tok.op === "=" ? String(raw).toLowerCase() === tok.val : String(raw).toLowerCase().includes(tok.val);
    switch (tok.op) {
      case ">": return num > target;
      case "<": return num < target;
      case ">=": return num >= target;
      case "<=": return num <= target;
      case "=": return num === target;
      default: return true;
    }
  });
}

function downloadCSV(title, columns, rows) {
  const esc = (v) => { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [columns.map((c) => esc(c.label)).join(",")];
  rows.forEach((r) => lines.push(columns.map((c) => esc(c.csv ? c.csv(r) : cellValue(c, r))).join(",")));
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = (title || "export").replace(/\s+/g, "_").toLowerCase() + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function RowFormModal({ open, title, fields, initial, onClose, onSubmit }) {
  const t = useTheme();
  const [vals, setVals] = useState({});
  const [err, setErr] = useState("");
  const firstRef = useRef(null);

  useEffect(() => {
    if (open) {
      const base = {};
      fields.forEach((f) => {
        base[f.key] = initial ? initial[f.key] : (f.type === "number" ? "" : f.type === "select" ? f.options[0] : "");
      });
      setVals(base);
      setErr("");
      const id = setTimeout(() => firstRef.current && firstRef.current.focus(), 30);
      return () => clearTimeout(id);
    }
  }, [open]);

  if (!open) return null;

  const set = (k, v) => setVals((s) => ({ ...s, [k]: v }));
  const submit = () => {
    const req = fields.find((f) => f.required && !String(vals[f.key] || "").trim());
    if (req) { setErr("“" + req.label + "” is required."); return; }
    const out = {};
    fields.forEach((f) => { out[f.key] = f.type === "number" ? Number(vals[f.key]) || 0 : vals[f.key]; });
    if (initial) Object.keys(initial).forEach((k) => { if (!(k in out)) out[k] = initial[k]; });
    onSubmit(out);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-16 px-4 bg-black/40 backdrop-blur-sm rg-fade" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className={`w-full max-w-md ${t.cardBg} backdrop-blur-md border ${t.border} rounded-2xl shadow-2xl overflow-hidden rg-pop`}>
        <div className={`flex items-center justify-between px-5 py-4 border-b ${t.borderLight}`}>
          <h3 className={`text-sm font-semibold ${t.text}`}>{title}</h3>
          <button onClick={onClose} className={`w-7 h-7 rounded-lg flex items-center justify-center ${t.textMuted} ${t.hover}`}><X className="w-4 h-4" /></button>
        </div>
        <div className="p-5 max-h-[60vh] overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-4">
          {fields.map((f, i) => (
            <div key={f.key} className={f.type === "text" && f.key === "notes" ? "sm:col-span-2" : ""}>
              <label className={`block text-xs font-medium ${t.textMuted} mb-1.5`}>{f.label}{f.required && <span className="text-red-500"> *</span>}</label>
              {f.type === "select" ? (
                <select
                  ref={i === 0 ? firstRef : null}
                  value={vals[f.key] ?? ""}
                  onChange={(e) => set(f.key, e.target.value)}
                  className={`w-full px-3 py-2 rounded-xl border ${t.inputBorder} text-sm ${t.inputBg} ${t.text} focus:outline-none focus:ring-2 ${t.accentRing}`}
                >
                  {f.options.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              ) : (
                <input
                  ref={i === 0 ? firstRef : null}
                  type={f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}
                  value={vals[f.key] ?? ""}
                  onChange={(e) => set(f.key, e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
                  className={`w-full px-3 py-2 rounded-xl border ${t.inputBorder} text-sm ${t.inputBg} ${t.text} focus:outline-none focus:ring-2 ${t.accentRing}`}
                />
              )}
            </div>
          ))}
        </div>
        {err && <p className="px-5 -mt-1 pb-1 text-xs text-red-500">{err}</p>}
        <div className={`flex items-center justify-end gap-2 px-5 py-4 border-t ${t.borderLight}`}>
          <button onClick={onClose} className={`px-4 py-2 rounded-xl border ${t.border} text-sm font-medium ${t.textMuted} ${t.hover}`}>Cancel</button>
          <button onClick={submit} className={`px-4 py-2 rounded-xl ${t.accentSolid} ${t.accentSolidHover} text-white text-sm font-medium shadow-sm`}>{initial ? "Save changes" : "Add"}</button>
        </div>
      </div>
    </div>
  );
}

// Generic sortable / filterable / editable / exportable table
// ---------------------------------------------------------------------------

function DataTable({ title, subtitle, columns, rows, fields, addLabel, onAdd, onSave, onDelete }) {
  const t = useTheme();
  const { query, setQuery } = useQuery();
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [formOpen, setFormOpen] = useState(false);
  const [editIndex, setEditIndex] = useState(null);
  const editable = !!fields;

  const tokens = useMemo(() => parseQuery(query), [query]);
  const indexed = useMemo(() => rows.map((row, __i) => ({ row, __i })), [rows]);
  const filtered = useMemo(() => indexed.filter((x) => matchRow(x.row, tokens, columns)), [indexed, tokens, columns]);

  const sorted = useMemo(() => {
    if (!sortKey) return filtered;
    const col = columns.find((c) => c.key === sortKey);
    if (!col) return filtered;
    const arr = [...filtered].sort((a, b) => {
      const av = cellValue(col, a.row), bv = cellValue(col, b.row);
      return col.numeric ? Number(av) - Number(bv) : String(av).localeCompare(String(bv));
    });
    if (sortDir === "desc") arr.reverse();
    return arr;
  }, [filtered, sortKey, sortDir, columns]);

  const totals = useMemo(() => {
    const out = {};
    columns.forEach((c) => { if (c.total) out[c.key] = sorted.reduce((s, x) => s + (Number(cellValue(c, x.row)) || 0), 0); });
    return out;
  }, [sorted, columns]);

  const moneyCols = columns.filter((c) => c.total && c.money);
  const hasTotals = Object.keys(totals).length > 0;
  const colCount = columns.length + (editable ? 1 : 0);

  const toggleSort = (col) => {
    if (col.sortable === false) return;
    if (sortKey === col.key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(col.key); setSortDir("asc"); }
  };

  const openAdd = () => { setEditIndex(null); setFormOpen(true); };
  const openEdit = (i) => { setEditIndex(i); setFormOpen(true); };
  const submitForm = (row) => {
    if (editIndex == null) onAdd && onAdd(row);
    else onSave && onSave(editIndex, row);
    setFormOpen(false);
  };
  const remove = (i, label) => { if (window.confirm("Delete this row" + (label ? ' — "' + label + '"' : "") + "?")) onDelete && onDelete(i); };

  return (
    <Card className="overflow-hidden">
      <div className={`p-5 flex flex-wrap items-center justify-between gap-3 border-b ${t.borderLight}`}>
        <SectionHeader title={title} subtitle={subtitle} />
        <div className="flex items-center gap-2">
          <button onClick={() => downloadCSV(title, columns, sorted.map((x) => x.row))} className={`inline-flex items-center gap-1.5 border ${t.border} ${t.hover} ${t.textMuted} text-sm font-medium px-3 py-2 rounded-xl transition-colors`} title="Export current view to CSV">
            <Download className="w-4 h-4" /> CSV
          </button>
          {editable && addLabel && (
            <button onClick={openAdd} className={`inline-flex items-center gap-1.5 ${t.accentSolid} ${t.accentSolidHover} text-white text-sm font-medium px-4 py-2 rounded-xl shadow-sm transition-colors`}>
              <Plus className="w-4 h-4" /> {addLabel}
            </button>
          )}
        </div>
      </div>

      <div className={`px-5 py-2.5 flex flex-wrap items-center gap-x-5 gap-y-1 text-xs ${t.textMuted} ${t.theadBg} border-b ${t.borderLight}`}>
        <span><b className={t.text}>{sorted.length}</b> of {rows.length} rows</span>
        {moneyCols.map((c) => (<span key={c.key}>{c.label}: <b className={t.text}>{money(totals[c.key] || 0)}</b></span>))}
        {query && (<button onClick={() => setQuery("")} className={`inline-flex items-center gap-1 ${t.accentTextSolid} font-medium`}><X className="w-3 h-3" /> clear filter</button>)}
      </div>

      <div className="overflow-x-auto">
        <table className="w-full">
          <thead className={t.theadBg}>
            <tr>
              {columns.map((c) => (
                <th key={c.key} onClick={() => toggleSort(c)} className={`text-left text-xs font-semibold ${t.textMuted} uppercase tracking-wide px-4 py-3 whitespace-nowrap ${c.sortable === false ? "" : "cursor-pointer select-none " + t.hover}`}>
                  <span className="inline-flex items-center gap-1">{c.label}{sortKey === c.key ? (sortDir === "asc" ? <ChevronUp className="w-3.5 h-3.5" /> : <ChevronDown className="w-3.5 h-3.5" />) : null}</span>
                </th>
              ))}
              {editable && <th className={`px-4 py-3 text-right text-xs font-semibold ${t.textMuted} uppercase tracking-wide`}>Edit</th>}
            </tr>
          </thead>
          <tbody className={`divide-y ${t.borderLight}`}>
            {sorted.map((x) => (
              <tr key={x.__i} className={`${t.hover} transition-colors group`}>
                {columns.map((c) => (
                  <td key={c.key} className={`px-4 py-3 text-sm ${t.text} whitespace-nowrap ${c.className || ""}`}>{c.render ? c.render(x.row) : cellValue(c, x.row)}</td>
                ))}
                {editable && (
                  <td className="px-4 py-3 whitespace-nowrap text-right">
                    <div className="inline-flex items-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                      <button onClick={() => openEdit(x.__i)} title="Edit" className={`w-7 h-7 rounded-lg flex items-center justify-center ${t.textMuted} ${t.hover}`}><Pencil className="w-3.5 h-3.5" /></button>
                      <button onClick={() => remove(x.__i, x.row.name || x.row.item || x.row.page)} title="Delete" className={`w-7 h-7 rounded-lg flex items-center justify-center text-red-500 ${t.hover}`}><Trash2 className="w-3.5 h-3.5" /></button>
                    </div>
                  </td>
                )}
              </tr>
            ))}
            {sorted.length === 0 && (
              <tr><td colSpan={colCount} className={`px-4 py-12 text-center text-sm ${t.textFaint}`}>
                {rows.length === 0 ? "No rows yet — use the Add button to enter your data." : `No rows match “${query}”.`}
              </td></tr>
            )}
          </tbody>
          {hasTotals && sorted.length > 0 && (
            <tfoot>
              <tr className={`${t.theadBg} border-t ${t.border}`}>
                {columns.map((c, idx) => (
                  <td key={c.key} className={`px-4 py-3 text-sm font-semibold ${t.text} whitespace-nowrap`}>
                    {idx === 0 ? "Total" : c.total ? (c.money ? money(totals[c.key]) : totals[c.key].toLocaleString()) : ""}
                  </td>
                ))}
                {editable && <td />}
              </tr>
            </tfoot>
          )}
        </table>
      </div>

      {editable && (
        <RowFormModal
          open={formOpen}
          title={editIndex == null ? (addLabel || "Add row") : "Edit row"}
          fields={fields}
          initial={editIndex == null ? null : rows[editIndex]}
          onClose={() => setFormOpen(false)}
          onSubmit={submitForm}
        />
      )}
    </Card>
  );
}

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <StatCard label="Revenue (Jul)" value={money(totalRev)} icon={TrendingUp} />
        <StatCard label="Expenses (Jul)" value={money(totalExp)} icon={Wallet} />
        <StatCard label="Net Profit (Jul)" value={money(totalRev - totalExp)} icon={Target} />

    </div>
  );
}

// ---------------------------------------------------------------------------
// Theme picker + command palette
// ---------------------------------------------------------------------------

function ThemePicker({ isDark, setIsDark, accentKey, setAccentKey }) {
  const t = useTheme();
  const [open, setOpen] = useState(false);
  return (
    <div className="relative">
      <button onClick={() => setOpen((o) => !o)} className={`w-9 h-9 rounded-xl border ${t.border} flex items-center justify-center ${t.textMuted} ${t.hover} transition-colors`} title="Theme"><Palette className="w-4 h-4" /></button>
      {open && (
        <div className={`absolute right-0 mt-2 w-56 ${t.cardBg} backdrop-blur-md border ${t.border} rounded-2xl shadow-lg p-4 z-30 rg-pop`}>
          <div className="flex items-center justify-between mb-3">
            <p className={`text-xs font-semibold ${t.textMuted} uppercase tracking-wide`}>Appearance</p>
            <button onClick={() => setIsDark((d) => !d)} className={`w-7 h-7 rounded-lg flex items-center justify-center border ${t.border} ${t.hover}`}>{isDark ? <Moon className="w-3.5 h-3.5" /> : <Sun className="w-3.5 h-3.5" />}</button>
          </div>
          <p className={`text-xs font-semibold ${t.textMuted} uppercase tracking-wide mb-2`}>Accent color</p>
          <div className="grid grid-cols-4 gap-2">
            {ACCENTS.map((ac) => (
              <button key={ac.key} onClick={() => setAccentKey(ac.key)} title={ac.label} className="w-9 h-9 rounded-full flex items-center justify-center border-2 transition-transform hover:scale-110" style={{ backgroundColor: ac.hex, borderColor: accentKey === ac.key ? (t.isDark ? "#f1f5f9" : "#0f172a") : "transparent" }}>
                {accentKey === ac.key && <Check className="w-4 h-4 text-white" strokeWidth={3} />}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function CommandPalette({ open, setOpen, setActive, isDark, setIsDark, setAccentKey, resetData }) {
  const t = useTheme();
  const [q, setQ] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    if (open) { setQ(""); const id = setTimeout(() => inputRef.current && inputRef.current.focus(), 0); return () => clearTimeout(id); }
  }, [open]);

  if (!open) return null;

  const items = [];
  NAV.forEach((n) => items.push({ id: "nav:" + n.id, label: "Go to " + n.label, icon: n.icon, run: () => { setActive(n.id); setOpen(false); } }));
  items.push({ id: "theme", label: isDark ? "Switch to light mode" : "Switch to dark mode", icon: isDark ? Sun : Moon, run: () => { setIsDark((d) => !d); setOpen(false); } });
  items.push({ id: "reset", label: "Reset to sample data", icon: RotateCcw, run: () => { if (window.confirm("Replace all current data with the original sample data? This clears your edits in this browser.")) resetData(); setOpen(false); } });
  ACCENTS.forEach((a) => items.push({ id: "accent:" + a.key, label: "Accent color: " + a.label, dot: a.hex, run: () => { setAccentKey(a.key); setOpen(false); } }));

  const filtered = items.filter((it) => it.label.toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24 px-4 bg-black/40 backdrop-blur-sm rg-fade" onClick={() => setOpen(false)}>
      <div onClick={(e) => e.stopPropagation()} className={`w-full max-w-lg ${t.cardBg} backdrop-blur-md border ${t.border} rounded-2xl shadow-2xl overflow-hidden rg-pop`}>
        <div className={`flex items-center gap-2 px-4 py-3 border-b ${t.borderLight}`}>
          <Search className={`w-4 h-4 ${t.textFaint}`} />
          <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && filtered[0]) filtered[0].run(); if (e.key === "Escape") setOpen(false); }} placeholder="Jump to a view, change theme, reset data…" className={`flex-1 bg-transparent outline-none text-sm ${t.text}`} />
          <span className={`text-[10px] ${t.textFaint} border ${t.border} rounded px-1.5 py-0.5`}>ESC</span>
        </div>
        <div className="max-h-80 overflow-y-auto py-2">
          {filtered.map((it) => (
            <button key={it.id} onClick={it.run} className={`w-full flex items-center gap-3 px-4 py-2 text-sm ${t.text} ${t.hover} text-left transition-colors`}>
              {it.icon ? <it.icon className={`w-4 h-4 ${t.textMuted}`} /> : <span className="w-3.5 h-3.5 rounded-full flex-shrink-0" style={{ backgroundColor: it.dot }} />}
              {it.label}
            </button>
          ))}
          {filtered.length === 0 && <p className={`px-4 py-6 text-center text-sm ${t.textFaint}`}>No matches</p>}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------------

function readStored(key, fallback) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch (e) { return fallback; }
}
function loadData() {
  try { const raw = localStorage.getItem("rg-data-v1"); if (raw) { const d = JSON.parse(raw); if (d && d.assets && d.pages && d.budget && d.revenue) return d; } } catch (e) {}
  return { assets: SEED.assets, pages: SEED.pages, budget: SEED.budget, revenue: SEED.revenue };
}

function NavList({ active, setActive, onNavigate }) {
  const t = useTheme();
  return (
    <nav className="flex-1 px-3 py-4 space-y-1">
      {NAV.map((item) => {
        const Icon = item.icon;
        const isActive = active === item.id;
        return (
          <button key={item.id} onClick={() => { setActive(item.id); onNavigate && onNavigate(); }} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors duration-200 ${isActive ? `${t.accentLightBg} ${t.accentText}` : `${t.textMuted} ${t.hover}`}`}>
            <Icon className="w-4 h-4" strokeWidth={2} />
            {item.label}
            {isActive && <ChevronRight className="w-3.5 h-3.5 ml-auto" />}
          </button>
        );
      })}
    </nav>
  );
}

function SidebarInner({ active, setActive, onNavigate }) {
  const t = useTheme();
  return (
    <>
      <div className={`h-16 flex items-center gap-2.5 px-5 border-b ${t.borderLight}`}>
        <div className={`w-8 h-8 rounded-lg ${t.accentSolid} flex items-center justify-center`}><Flag className="w-4 h-4 text-white" /></div>
        <div><p className={`text-sm font-semibold ${t.text} leading-none`}>RunGate Cash</p><p className={`text-[11px] ${t.textFaint} leading-none mt-0.5`}>Portfolio Manager</p></div>
      </div>
      <NavList active={active} setActive={setActive} onNavigate={onNavigate} />
      <div className={`p-4 border-t ${t.borderLight}`}>
        <div className={`rounded-xl ${t.inputBg} p-3.5`}><p className={`text-xs font-medium ${t.text}`}>10 Pages live</p><p className={`text-[11px] ${t.textMuted} mt-0.5`}>Break-even estimated Sep 2026</p></div>
      </div>
    </>
  );
}

function App() {
  const [active, setActive] = useState("dashboard");
  const [query, setQuery] = useState("");
  const [isDark, setIsDark] = useState(() => readStored("rg-dark", "0") === "1");
  const [accentKey, setAccentKey] = useState(() => readStored("rg-accent", "blue"));
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [mobileNav, setMobileNav] = useState(false);
  const [data, setData] = useState(() => loadData());

  useEffect(() => { try { localStorage.setItem("rg-dark", isDark ? "1" : "0"); } catch (e) {} }, [isDark]);
  useEffect(() => { try { localStorage.setItem("rg-accent", accentKey); } catch (e) {} }, [accentKey]);
  useEffect(() => { try { localStorage.setItem("rg-data-v1", JSON.stringify(data)); } catch (e) {} }, [data]);

  useEffect(() => {
    const h = (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPaletteOpen((o) => !o); } };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const addRow = (ds, row) => setData((d) => ({ ...d, [ds]: [...d[ds], row] }));
  const updateRow = (ds, idx, row) => setData((d) => ({ ...d, [ds]: d[ds].map((r, i) => (i === idx ? row : r)) }));
  const deleteRow = (ds, idx) => setData((d) => ({ ...d, [ds]: d[ds].filter((_, i) => i !== idx) }));
  const resetData = () => setData({ assets: SEED.assets, pages: SEED.pages, budget: SEED.budget, revenue: SEED.revenue });

  const t = useMemo(() => buildTokens(isDark, accentKey), [isDark, accentKey]);
  const dataApi = useMemo(() => ({ data, addRow, updateRow, deleteRow, resetData }), [data]);
  const navApi = useMemo(() => ({ go: setActive }), []);

  const view = useMemo(() => {
    switch (active) {
      case "assets": return <AssetsView />;
      case "pages": return <PagesView />;
      case "content": return <ContentView />;
      case "budget": return <BudgetView />;
      case "revenue": return <RevenueView />;
      case "timeline": return <TimelineView />;
      default: return <DashboardView />;
    }
  }, [active]);

  const activeLabel = NAV.find((n) => n.id === active)?.label ?? "Dashboard";

  return (
    <ThemeContext.Provider value={t}>
     <QueryContext.Provider value={{ query, setQuery }}>
      <DataContext.Provider value={dataApi}>
       <NavContext.Provider value={navApi}>
        <div className={`min-h-screen ${t.page} flex ${t.text}`} style={{ fontFamily: "Inter, ui-sans-serif, system-ui" }}>
          {/* Desktop sidebar */}
          <aside className={`hidden md:flex w-60 flex-shrink-0 ${t.sidebarBg} border-r ${t.border} flex-col sticky top-0 h-screen`}>
            <SidebarInner active={active} setActive={setActive} />
          </aside>

          {/* Mobile drawer */}
          {mobileNav && (
            <div className="fixed inset-0 z-50 md:hidden">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm rg-fade" onClick={() => setMobileNav(false)} />
              <aside className={`absolute left-0 top-0 h-full w-64 ${t.sidebarBg} border-r ${t.border} flex flex-col rg-slide`}>
                <SidebarInner active={active} setActive={setActive} onNavigate={() => setMobileNav(false)} />
              </aside>
            </div>
          )}

          <div className="flex-1 min-w-0">
            <header className={`h-16 ${t.headerBg} backdrop-blur-sm border-b ${t.border} flex items-center justify-between px-4 sm:px-6 sticky top-0 z-20 gap-2`}>
              <div className="flex items-center gap-2 min-w-0">
                <button onClick={() => setMobileNav(true)} className={`md:hidden w-9 h-9 rounded-xl border ${t.border} flex items-center justify-center ${t.textMuted} ${t.hover}`}><Menu className="w-4 h-4" /></button>
                <div className="min-w-0">
                  <p className={`text-xs ${t.textFaint} hidden sm:block`}>Pages</p>
                  <h1 className={`text-base font-semibold ${t.text} truncate`}>{activeLabel}</h1>
                </div>
              </div>
              <div className="flex items-center gap-2 sm:gap-3">
                <div className="relative hidden sm:block">
                  <Search className={`w-4 h-4 ${t.textFaint} absolute left-3 top-1/2 -translate-y-1/2`} />
                  <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search or filter, e.g. revenue > 100" title="Filter the current table. Supports field:value and >, <, >=, <=" className={`w-44 lg:w-72 pl-9 pr-8 py-2 rounded-xl border ${t.border} text-sm ${t.inputBg} focus:outline-none focus:ring-2 ${t.accentRing} transition-all ${t.text}`} />
                  {query && <button onClick={() => setQuery("")} title="Clear" className={`absolute right-2.5 top-1/2 -translate-y-1/2 ${t.textFaint}`}><X className="w-3.5 h-3.5" /></button>}
                </div>
                <button onClick={() => setPaletteOpen(true)} title="Command palette (⌘K)" className={`hidden sm:flex items-center gap-1.5 h-9 px-3 rounded-xl border ${t.border} ${t.textMuted} ${t.hover} transition-colors text-xs font-medium`}><span className="text-sm leading-none">⌘</span>K</button>
                <ThemePicker isDark={isDark} setIsDark={setIsDark} accentKey={accentKey} setAccentKey={setAccentKey} />
              </div>
            </header>
            <main className="p-4 sm:p-6">{view}</main>
          </div>
        </div>

        <CommandPalette open={paletteOpen} setOpen={setPaletteOpen} setActive={setActive} isDark={isDark} setIsDark={setIsDark} setAccentKey={setAccentKey} resetData={resetData} />
       </NavContext.Provider>
      </DataContext.Provider>
     </QueryContext.Provider>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Compile the JSX with the CLASSIC runtime (uses the global React.createElement) and run it. -->
  <script>
    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
