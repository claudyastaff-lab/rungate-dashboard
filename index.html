    (function () {

      const safelist = [];
      accents.forEach(function (a) {
        safelist.push(
          "bg-" + a + "-600", "hover:bg-" + a + "-700",
          "text-" + a + "-300", "text-" + a + "-700", "text-" + a + "-600",
          "bg-" + a + "-950", "bg-" + a + "-50",
          "border-" + a + "-800", "border-" + a + "-200",
          "focus:ring-" + a + "-200", "bg-" + a + "-500"
        );
      });
      window.tailwind = window.tailwind || {};
      tailwind.config = { safelist: safelist };
    })();
  </script>

    isDark,

    page: isDark ? "bg-slate-950" : "bg-slate-50",

    cardBg: isDark ? "bg-slate-900/80" : "bg-white/80",
    border: isDark ? "border-slate-800" : "border-slate-200",
    borderLight: isDark ? "border-slate-800" : "border-slate-100",
    hover: isDark ? "hover:bg-slate-800/60" : "hover:bg-slate-50/60",
    inputBg: isDark ? "bg-slate-800" : "bg-slate-50",
    sidebarBg: isDark ? "bg-slate-900" : "bg-white",

    theadBg: isDark ? "bg-slate-800/50" : "bg-slate-50/80",
    chipBg: isDark ? "bg-slate-800" : "bg-slate-100",
    // accent-derived (built from literal shade classes so they stay core utilities)
    accentSolid: `bg-${a}-600`,
    accentSolidHover: `hover:bg-${a}-700`,
    accentText: isDark ? `text-${a}-300` : `text-${a}-700`,
    accentTextSolid: `text-${a}-600`,
    accentLightBg: isDark ? `bg-${a}-950` : `bg-${a}-50`,
    accentBorder: isDark ? `border-${a}-800` : `border-${a}-200`,
    accentRing: `focus:ring-${a}-200`,

  };
}

function StatCard({ label, value, delta, deltaDir, icon: Icon }) {
  const t = useTheme();
  return (
    <Card className="p-5 relative overflow-hidden group">
      <div className={`absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 ${t.accentSolid} transition-transform duration-500 group-hover:scale-125`} />

          <Icon className={`w-5 h-5 ${t.accentTextSolid}`} strokeWidth={2} />

      </div>
      {delta && (
        <div className={`mt-3 flex items-center gap-1 text-xs font-medium ${deltaDir === "up" ? "text-emerald-600" : "text-red-500"}`}>

  );
}

      </div>

}

function ContentView() {
  const t = useTheme();
  return (
    <div>
      <SectionHeader title="Content Production" subtitle="Drag-and-drop pipeline across all Pages" action={<PrimaryButton>New Content</PrimaryButton>} />
      <div className="flex gap-4 overflow-x-auto pb-2">
        {CONTENT_COLUMNS.map((col) => {

          return (
            <div key={col} className="flex-shrink-0 w-64">

              </div>
              <div className="space-y-3">
                {cards.map((c, i) => (
                  <Card key={i} className="p-3.5 cursor-grab">
                    <p className={`text-sm font-medium ${t.text} mb-1`}>{c.page}</p>
                    <p className={`text-xs ${t.textMuted} mb-3`}>{c.type} &middot; {c.editor}</p>

                  </Card>
                ))}
                {cards.length === 0 && (

function RevenueView() {
  const t = useTheme();
  const totalRev = REVENUE_TABLE.reduce((s, r) => s + r.revenue, 0);
  const totalExp = REVENUE_TABLE.reduce((s, r) => s + r.expenses, 0);
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <StatCard label="Revenue (Jul)" value={money(totalRev)} icon={TrendingUp} />
        <StatCard label="Expenses (Jul)" value={money(totalExp)} icon={Wallet} />
        <StatCard label="Net Profit (Jul)" value={money(totalRev - totalExp)} icon={Target} />
      </div>
      <Card className="overflow-hidden">
        <div className={`p-5 border-b ${t.borderLight}`}>
          <SectionHeader title="Revenue by Page" subtitle="Current month" />
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className={t.theadBg}>
              <tr><Th>Facebook Page</Th><Th>Month</Th><Th>Revenue</Th><Th>Expenses</Th><Th>Net Profit</Th><Th>ROI</Th></tr>
            </thead>
            <tbody className={`divide-y ${t.borderLight}`}>
              {REVENUE_TABLE.map((r) => {
                const net = r.revenue - r.expenses;
                const roi = r.expenses ? ((net / r.expenses) * 100).toFixed(0) : "-";
                return (
                  <tr key={r.page} className={`${t.hover} transition-colors`}>
                    <Td className="font-medium">{r.page}</Td>
                    <Td>{r.month}</Td>
                    <Td>{money(r.revenue)}</Td>
                    <Td>{money(r.expenses)}</Td>
                    <Td className={net >= 0 ? "text-emerald-600 font-medium" : "text-red-500 font-medium"}>{money(net)}</Td>
                    <Td className={net >= 0 ? "text-emerald-600 font-medium" : "text-red-500 font-medium"}>{roi}%</Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function TimelineView() {
  const t = useTheme();
  return (
    <Card className="p-6">
      <SectionHeader title="Project Timeline" subtitle="Key milestones for the Pages portfolio" />
      <div className="relative pl-6">
        <div className={`absolute left-[7px] top-1 bottom-1 w-px ${t.isDark ? "bg-slate-800" : "bg-slate-200"}`} />

                tl.status === "Done" ? "bg-emerald-500" : tl.status === "In Progress" ? t.accentSolid : "bg-slate-300"

                <div>
                  <p className={`text-sm font-medium ${t.text}`}>{tl.milestone}</p>

                </div>
                <StatusBadge status={tl.status} />
              </div>
            </div>
          ))}
        </div>
      </div>

// ---------------------------------------------------------------------------
// Theme picker
// ---------------------------------------------------------------------------

function ThemePicker({ isDark, setIsDark, accentKey, setAccentKey }) {
  const t = useTheme();
  const [open, setOpen] = useState(false);
  return (
    <div className="relative">
      <button
        onClick={() => setOpen((o) => !o)}
        className={`w-9 h-9 rounded-xl border ${t.border} flex items-center justify-center ${t.textMuted} ${t.hover} transition-colors`}
        title="Theme"
      >
        <Palette className="w-4 h-4" />
      </button>
      {open && (
        <div className={`absolute right-0 mt-2 w-56 ${t.cardBg} backdrop-blur-md border ${t.border} rounded-2xl shadow-lg p-4 z-20`}>
          <div className="flex items-center justify-between mb-3">
            <p className={`text-xs font-semibold ${t.textMuted} uppercase tracking-wide`}>Appearance</p>
            <button
              onClick={() => setIsDark((d) => !d)}
              className={`w-7 h-7 rounded-lg flex items-center justify-center border ${t.border} ${t.hover}`}
            >
              {isDark ? <Moon className="w-3.5 h-3.5" /> : <Sun className="w-3.5 h-3.5" />}
            </button>
          </div>
          <p className={`text-xs font-semibold ${t.textMuted} uppercase tracking-wide mb-2`}>Accent color</p>
          <div className="grid grid-cols-4 gap-2">
            {ACCENTS.map((ac) => (
              <button
                key={ac.key}
                onClick={() => setAccentKey(ac.key)}
                title={ac.label}
                className="w-9 h-9 rounded-full flex items-center justify-center border-2 transition-transform hover:scale-110"
                style={{ backgroundColor: ac.hex, borderColor: accentKey === ac.key ? (t.isDark ? "#f1f5f9" : "#0f172a") : "transparent" }}
              >
                {accentKey === ac.key && <Check className="w-4 h-4 text-white" strokeWidth={3} />}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------------

function App() {
  const [active, setActive] = useState("dashboard");
  const [query, setQuery] = useState("");
  const [isDark, setIsDark] = useState(false);
  const [accentKey, setAccentKey] = useState("blue");

  const t = useMemo(() => buildTokens(isDark, accentKey), [isDark, accentKey]);

  const view = useMemo(() => {
    switch (active) {
      case "assets": return <AssetsView />;
      case "pages": return <PagesView />;
      case "content": return <ContentView />;
      case "budget": return <BudgetView />;
      case "revenue": return <RevenueView />;
      case "timeline": return <TimelineView />;
      default: return <DashboardView />;
    }
  }, [active, isDark, accentKey]);

  const activeLabel = NAV.find((n) => n.id === active)?.label ?? "Dashboard";

  return (
    <ThemeContext.Provider value={t}>
      <div className={`min-h-screen ${t.page} flex ${t.text}`} style={{ fontFamily: "Inter, ui-sans-serif, system-ui" }}>
        {/* Sidebar */}
        <aside className={`w-60 flex-shrink-0 ${t.sidebarBg} border-r ${t.border} flex flex-col sticky top-0 h-screen`}>
          <div className={`h-16 flex items-center gap-2.5 px-5 border-b ${t.borderLight}`}>
            <div className={`w-8 h-8 rounded-lg ${t.accentSolid} flex items-center justify-center`}>
              <Flag className="w-4.5 h-4.5 text-white" />
            </div>
            <div>
              <p className={`text-sm font-semibold ${t.text} leading-none`}>RunGate Cash</p>
              <p className={`text-[11px] ${t.textFaint} leading-none mt-0.5`}>Portfolio Manager</p>
            </div>
          </div>
          <nav className="flex-1 px-3 py-4 space-y-1">
            {NAV.map((item) => {
              const Icon = item.icon;
              const isActive = active === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActive(item.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors duration-200 ${
                    isActive ? `${t.accentLightBg} ${t.accentText}` : `${t.textMuted} ${t.hover}`
                  }`}
                >
                  <Icon className="w-4 h-4" strokeWidth={2} />
                  {item.label}
                  {isActive && <ChevronRight className="w-3.5 h-3.5 ml-auto" />}
                </button>
              );
            })}
          </nav>
          <div className={`p-4 border-t ${t.borderLight}`}>
            <div className={`rounded-xl ${t.inputBg} p-3.5`}>
              <p className={`text-xs font-medium ${t.text}`}>10 Pages live</p>
              <p className={`text-[11px] ${t.textMuted} mt-0.5`}>Break-even estimated Sep 2026</p>
            </div>
          </div>
        </aside>

        {/* Main */}
        <div className="flex-1 min-w-0">
          <header className={`h-16 ${t.headerBg} backdrop-blur-sm border-b ${t.border} flex items-center justify-between px-6 sticky top-0 z-10`}>
            <div>
              <p className={`text-xs ${t.textFaint}`}>Pages</p>
              <h1 className={`text-base font-semibold ${t.text}`}>{activeLabel}</h1>
            </div>
            <div className="flex items-center gap-3">
              <div className="relative hidden sm:block">
                <Search className={`w-4 h-4 ${t.textFaint} absolute left-3 top-1/2 -translate-y-1/2`} />
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Search..."
                  className={`w-56 pl-9 pr-3 py-2 rounded-xl border ${t.border} text-sm ${t.inputBg} focus:outline-none focus:ring-2 ${t.accentRing} transition-all ${t.text}`}
                />
              </div>
              <button className={`w-9 h-9 rounded-xl border ${t.border} flex items-center justify-center ${t.textMuted} ${t.hover} transition-colors`}>
                <Users className="w-4 h-4" />
              </button>
              <ThemePicker isDark={isDark} setIsDark={setIsDark} accentKey={accentKey} setAccentKey={setAccentKey} />
            </div>
          </header>
          <main className="p-6">{view}</main>
        </div>
      </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
